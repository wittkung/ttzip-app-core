[project]
name = "ttzip-app-core"
description = "TTZip Universal Cross-Platform Headless Application Core"

[project.min_tools]
rustc = "1.85"
cargo = "1.85"

[env]
RUST_BACKTRACE = "1"

[[stage]]
name = "loc-gate"
description = "Single-file LOC gate (<=800 LOC)"
run = "./scripts/lint_loc_gate.sh"
sources = ["src/**/*.rs", "crates/**/*.rs", "Sources/**/*.swift"]

[[stage]]
name = "rust-test"
description = "Rust workspace test suite"
run = "cargo test --workspace"
depends_on = ["loc-gate"]
sources = ["src/**/*.rs", "crates/**/*.rs", "Cargo.toml", "crates/**/Cargo.toml"]
timeout = 600

[[stage]]
name = "swift-test"
description = "Swift package build and test suite"
run = "./scripts/build_rust.sh --debug && swift test"
depends_on = ["loc-gate"]
sources = ["Sources/**/*.swift", "Tests/**/*.swift", "Package.swift"]
platforms = ["macos"]
timeout = 900
