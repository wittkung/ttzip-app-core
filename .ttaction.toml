[project]
name = "ttzip-app-core"
description = "TTZip Universal Cross-Platform Headless Application Core"

[project.min_tools]
rustc = "1.85"
cargo = "1.85"

[env]
RUST_BACKTRACE = "1"

[[stage]]
name = "rust-test"
description = "Rust workspace test suite"
run = "cargo test --workspace"
sources = ["src/**/*.rs", "crates/**/*.rs", "Cargo.toml", "crates/**/Cargo.toml"]
timeout = 600

[[stage]]
name = "swift-test"
description = "Swift package build and test suite"
run = "./scripts/build_rust.sh --debug && swift test"
sources = ["Sources/**/*.swift", "Tests/**/*.swift", "Package.swift"]
platforms = ["macos"]
timeout = 900
