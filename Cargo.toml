[package]
name = "ttzip-app-core"
version = "0.1.0"
edition = "2021"
authors = ["Witt Kung <witt.w.kung@gmail.com>", "TTZip Contributors"]
license = "MIT OR Apache-2.0"
description = "TTZip Universal Cross-Platform Headless Application Core"

[lib]
name = "ttzip_app_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
base64 = "0.22"
ed25519-dalek = "2.1"
rusb = "0.9.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uniffi = "0.28.3"
thiserror = "2.0"
uuid = { version = "1.10", features = ["serde", "v4"] }
parking_lot = "0.12"
bytes = "1.10"
tracing = "0.1"
zeroize = "1.8"

# Core data type dependencies
ttzip-types = { path = "crates/ttzip-types" }

[features]
default = ["direct"]
direct = []
mas = []

[dev-dependencies]
tempfile = "3.12"

[lints.rust]
warnings = "deny"

[workspace]
members = ["crates/ttzip-types"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Witt Kung <witt.w.kung@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/wittkung/ttzip-app-core"
homepage = "https://github.com/wittkung/ttzip-app-core"
documentation = "https://github.com/wittkung/ttzip-app-core"
edition = "2024"
keywords = ["compression", "zip", "7z", "simd", "archive"]
categories = ["compression", "command-line-utilities", "filesystem"]

[workspace.lints.rust]
warnings = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("gil-refs"))'] }

[workspace.lints.clippy]
missing_safety_doc = "allow"
not_unsafe_ptr_arg_deref = "allow"
too_many_arguments = "allow"
only_used_in_recursion = "allow"
collapsible_if = "allow"
collapsible_match = "allow"
needless_range_loop = "allow"
should_implement_trait = "allow"
