[package]
name = "ttzip-reader-storage"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "TTZip reader document persistence"

[dependencies]
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
tempfile = "3.12"

[lints]
workspace = true
